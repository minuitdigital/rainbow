# Le robot : relève la météo une fois par jour (Open-Meteo) et publie
# le site ; à chaque poussée sur main, republie sans relever.
#
# Le relevé n'est JAMAIS commité (un PNG par jour ≈ 250 Mo par an) : le
# cache le garde d'une exécution à l'autre, car Pages remplace tout le site
# et une poussée de code sans relevé perdrait la météo.
#
# Réglages : Pages -> Source : GitHub Actions ; Actions -> Workflow
# permissions -> Read and write. À la main : Actions, « Run workflow ».

name: site et météo

on:
  schedule:
    # 04h10 UTC : les sorties des modèles de 00 h arrivent vers 03-04 h.
    # Les deux autres sont des rattrapages si le quota partagé d'Open-Meteo
    # a cassé le relevé ; `--si-besoin` les rend gratuits sinon.
    - cron: '10 4 * * *'
    - cron: '10 11 * * *'
    - cron: '10 18 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Pas de `contents: write` : le robot ne commite rien.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication en attend une autre, sans l'annuler : sinon une
# poussée de code pourrait tuer un passage météo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    # Trois secondes entre requêtes (quota : 600 appels/min) : ~10 min,
    # le reste est la marge des réessais.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Le dernier relevé : sert tel quel sur une poussée de code, écrasé
      # par celui du jour sur le passage quotidien.
      - name: Retrouver le dernier relevé
        uses: actions/cache@v4
        with:
          path: |
            data/weather.png
            data/weather.json
          key: meteo-${{ github.run_id }}
          restore-keys: meteo-

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Installer numpy et pillow
        if: github.event_name != 'push'
        run: pip install --quiet numpy pillow

      # Jamais sur une poussée de code : elle ne doit pas consommer le quota.
      # Son échec n'arrête rien : la météo peut manquer, le site doit partir.
      # `--si-besoin` (passages programmés) : rien à faire si le cache a un
      # relevé de moins de vingt heures. À la main, on relève toujours.
      - name: Relever la météo mondiale
        if: github.event_name != 'push'
        continue-on-error: true
        id: releve
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python build/make_weather.py --si-besoin
          else
            python build/make_weather.py
          fi

      # Un robot vert ne doit pas cacher un relevé manquant.
      - name: Le relevé a-t-il abouti ?
        if: github.event_name != 'push'
        run: |
          if [ "${{ steps.releve.outcome }}" = "failure" ]; then
            echo "::warning::Le relevé météo a échoué — le site part avec le relevé précédent."
          else
            echo "Relevé du jour en place."
          fi

      # Exclure plutôt qu'énumérer : un dossier de données ajouté partira
      # seul, là où une liste blanche l'oublierait (piège n°13, page blanche).
      - name: Rassembler le site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='build' \
            --exclude='Claude outputs' \
            --exclude='*.md' \
            --exclude='serve.py' \
            ./ _site/
          echo "--- ce qui sera publié ---"
          find _site -maxdepth 2 -printf '%10s  %p\n' | sort -k2

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
