<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Essai des commandes</title>
<style>
  body { background:#111; color:#ddd; font:14px/1.5 monospace; margin:16px; }
  table { border-collapse:collapse; margin:8px 0; }
  td, th { border:1px solid #444; padding:2px 10px; text-align:left; }
  td.on { background:#6a6; color:#000; }
</style>
<h3>Essai des commandes</h3>
<p id="etat"></p>
<p id="pi"></p>
<table id="synth"></table>
<script>
// commande -> numéro d'axe de la manette (ordre de arduino/leonardo/leonardo.ino :
// la broche A0 est l'axe 0, A1 l'axe 1, A2 l'axe 2, A4 l'axe 3 … A11 l'axe 10).
// Sur la plaque d'essai le joystick est sur A0 et A1 : à changer ici si on le déplace.
const AXE = { 'JOYSTICK X': 0, 'JOYSTICK Y': 1, CHANCE: 2, TERRE: 3, MER: 4, IRISATION: 5,
  SENSIBILITÉ: 6, ICÔNES: 7, ZOOM: 8, MÉTÉO: 9, LÉGENDES: 10 };
const TEMPS = ['hier', 'maintenant', 'demain'];   // boutons 0, 1, 2
const POUSS = ['arcEnCiel', 'teleportation', 'repere', 'maison'];
const INTER = ['couloir', 'couleur', 'interface', 'formule', 'poeme'];
const $ = id => document.getElementById(id);
const pi = {};  // venu du service du Pi : poussoir -> nombre d'appuis, interrupteur -> true/false
const cases = {};

$('synth').innerHTML = '<tr><th>commande</th><th>valeur</th></tr>';
[...Object.keys(AXE), 'TEMPS', ...POUSS, ...INTER].forEach(n => {
  const r = $('synth').insertRow(); r.innerHTML = `<td>${n}</td><td></td>`; cases[n] = r.cells[1];
});

function pont() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => $('pi').textContent = 'service du Pi : connecté';
  ws.onmessage = e => { const { k, v } = JSON.parse(e.data); pi[k] = v === undefined ? (pi[k] || 0) + 1 : v; };
  ws.onclose = () => { $('pi').textContent = 'service du Pi : absent (poussoirs et interrupteurs muets)'; setTimeout(pont, 2000); };
}
pont();

function boucle() {
  const g = [...navigator.getGamepads()].find(x => x);
  $('etat').textContent = g ? `manette : ${g.id}, ${g.axes.length} axes, ${g.buttons.length} boutons`
    : 'Aucune manette. Tournez un bouton : Chrome ne la déclare qu\'après une première action.';
  for (const [n, i] of Object.entries(AXE))
    cases[n].textContent = g && g.axes[i] !== undefined ? ((g.axes[i] + 1) * 50).toFixed(1) + ' %' : '—';
  const t = g ? [0, 1, 2].findIndex(i => g.buttons[i] && g.buttons[i].pressed) : -1;
  cases.TEMPS.textContent = t < 0 ? '—' : TEMPS[t];
  POUSS.forEach(n => cases[n].textContent = pi[n] ? 'appuyé ' + pi[n] + ' fois' : '—');
  INTER.forEach(n => {
    cases[n].textContent = n in pi ? (pi[n] ? 'ON' : 'OFF') : '—';
    cases[n].className = pi[n] ? 'on' : '';
  });
  requestAnimationFrame(boucle);
}
boucle();
</script>
